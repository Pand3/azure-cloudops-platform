[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-cloudops-platform"
version = "0.1.0"
description = "Automation tooling for operating a Kubernetes platform on Azure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1.0",
    "pydantic>=2.11,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.16,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.16,<1.0",
]

[project.scripts]
cloudops = "cloudops.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cloudops --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 88